<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Alma — Conta-gotas</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; user-select: none; font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
    #shot { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    /* lupa: 15×15 pixels ampliados, com o do meio marcado */
    #loupe { position: fixed; left: 0; top: 0; width: 150px; height: 150px; border-radius: 50%; overflow: hidden; pointer-events: none;
      box-shadow: 0 0 0 3px #fff, 0 0 0 4px rgb(0 0 0 / .4), 0 14px 34px rgb(0 0 0 / .5); will-change: transform; }
    #zoom { width: 150px; height: 150px; image-rendering: pixelated; }
    #loupe::after { content: ''; position: absolute; left: 70px; top: 70px; width: 10px; height: 10px; box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px #000; }
    #tag { position: fixed; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: 999px; pointer-events: none;
      background: rgb(20 22 30 / .88); color: #f5f5f7; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; box-shadow: 0 8px 22px rgb(0 0 0 / .4); will-change: transform; }
    #sw { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .35); }
    #hint { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: rgb(20 22 30 / .85); color: #e8e8ee; font-size: 13px;
      box-shadow: 0 8px 22px rgb(0 0 0 / .35); transition: opacity .3s ease; }
  </style>
</head>
<body>
  <img id="shot" alt="" />
  <div id="hint">Clique para escolher a cor · setas movem 1 pixel · Enter confirma · Esc cancela</div>
  <div id="loupe"><canvas id="zoom" width="150" height="150"></canvas></div>
  <div id="tag"><span id="sw"></span><span id="hex">#000000</span></div>
  <script src="picker.js"></script>
</body>
</html>
